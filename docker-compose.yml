# A build spawns a worker per core and each opens its own connection. When the
# build ends the workers exit, but nothing tells Postgres: the connections are
# forwarded through Docker, so it keeps the backends and counts them against
# max_connections. Enough builds and the next one dies on "too many clients
# already" while every client that opened those connections is long gone.
#
# postgres.js closes its own idle connections, so this only ever reaps what has
# been abandoned. Two minutes is far longer than any query here, and far shorter
# than the hours an orphan would otherwise sit for.
services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "idle_session_timeout=120000"]
    environment:
      POSTGRES_DB: leaguecred
      POSTGRES_USER: leaguecred
      POSTGRES_PASSWORD: leaguecred
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaguecred -d leaguecred"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - leaguecred_postgres:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    command: ["postgres", "-c", "idle_session_timeout=120000"]
    environment:
      POSTGRES_DB: leaguecred_test
      POSTGRES_USER: leaguecred
      POSTGRES_PASSWORD: leaguecred
    ports:
      - "54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaguecred -d leaguecred_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  leaguecred_postgres:
