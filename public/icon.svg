<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Outer Hexagon Shield -->
  <polygon
    points="32,4 58,19 58,45 32,60 6,45 6,19"
    fill="#050d1c"
    stroke="#b2df00"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Inner Pitch Border -->
  <polygon
    points="32,8 54,20.5 54,43.5 32,56 10,43.5 10,20.5"
    fill="none"
    stroke="#b2df00"
    stroke-width="1.2"
    stroke-opacity="0.4"
    stroke-linejoin="round"
  />

  <!-- Center Halfway Line -->
  <line
    x1="10"
    y1="32"
    x2="54"
    y2="32"
    stroke="#b2df00"
    stroke-width="1.5"
    stroke-opacity="0.8"
  />

  <!-- Center Circle & Spot -->
  <circle
    cx="32"
    cy="32"
    r="9"
    fill="none"
    stroke="#b2df00"
    stroke-width="1.8"
  />
  <circle cx="32" cy="32" r="2.5" fill="#b2df00"/>

  <!-- Top Penalty Area -->
  <path
    d="M 22 13.5 L 42 13.5 L 42 22 L 22 22 Z"
    fill="none"
    stroke="#b2df00"
    stroke-width="1.2"
    stroke-opacity="0.7"
  />
  <path
    d="M 27 22 A 5 5 0 0 0 37 22"
    fill="none"
    stroke="#b2df00"
    stroke-width="1.2"
    stroke-opacity="0.7"
  />
  <circle cx="32" cy="18" r="1" fill="#b2df00"/>

  <!-- Bottom Penalty Area -->
  <path
    d="M 22 50.5 L 42 50.5 L 42 42 L 22 42 Z"
    fill="none"
    stroke="#b2df00"
    stroke-width="1.2"
    stroke-opacity="0.7"
  />
  <path
    d="M 27 42 A 5 5 0 0 1 37 42"
    fill="none"
    stroke="#b2df00"
    stroke-width="1.2"
    stroke-opacity="0.7"
  />
  <circle cx="32" cy="46" r="1" fill="#b2df00"/>

  <!-- Tactical Coordinate Nodes -->
  <line
    x1="18"
    y1="25"
    x2="25"
    y2="18"
    stroke="#b2df00"
    stroke-width="1"
    stroke-dasharray="1.5 1.5"
    stroke-opacity="0.6"
  />
  <circle cx="18" cy="25" r="1.2" fill="#b2df00"/>

  <line
    x1="46"
    y1="39"
    x2="39"
    y2="46"
    stroke="#b2df00"
    stroke-width="1"
    stroke-dasharray="1.5 1.5"
    stroke-opacity="0.6"
  />
  <circle cx="46" cy="39" r="1.2" fill="#b2df00"/>
</svg>
